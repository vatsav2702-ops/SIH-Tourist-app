name: smart_travel_companion
description: "Smart Travel & Heritage Companion - Tourist Navigation, AI Itinerary Planning, Vocal for Local Discovery, Audio Guide, Regional Translator and Emergency Safety."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase & Database
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # Navigation & Maps
  geolocator: ^10.1.0
  url_launcher: ^6.2.5

  # Media & Audio
  cached_network_image: ^3.3.1
  audioplayers: ^6.0.0
  google_fonts: ^6.1.0

  # AI & Utilities
  google_generative_ai: ^0.4.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http: ^1.6.0

  # Camera-based translation (ML Kit OCR)
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.13.1
  google_mlkit_translation: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
